<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Border Gradient: Emerald to Cyan -->
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00D2FE" />
    </linearGradient>

    <!-- Leaf Neon Gradient -->
    <linearGradient id="leafGrad" x1="16" y1="10" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#00D2FE" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Dark Sleek Squircle Container with Neon Gradient Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="#04080D" stroke="url(#badgeBorder)" stroke-width="3" />

  <!-- 2. Concentric Radar Detection Reticle (Dashed Circle) -->
  <circle
    cx="32"
    cy="32"
    r="21.5"
    stroke="#10B981"
    stroke-width="2"
    stroke-dasharray="3.5 3"
    opacity="0.85"
  />

  <!-- 3. Radar Axis Ticks (Top, Bottom, Left, Right) -->
  <line x1="32" y1="4.5" x2="32" y2="11" stroke="#34D399" stroke-width="3" stroke-linecap="round" />
  <line x1="32" y1="53" x2="32" y2="59.5" stroke="#34D399" stroke-width="3" stroke-linecap="round" />
  <line x1="4.5" y1="32" x2="11" y2="32" stroke="#00D2FE" stroke-width="3" stroke-linecap="round" />
  
  <!-- Right Radar Axis with Arrow Indicator -->
  <line x1="53" y1="32" x2="58.5" y2="32" stroke="#00D2FE" stroke-width="3" stroke-linecap="round" />
  <path d="M56 29.5L59.5 32L56 34.5" stroke="#00D2FE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 4. Eco-Leaf Outer Contour -->
  <path
    d="M32 9.5C32 9.5 46.5 16.5 46.5 32C46.5 41.5 39.5 48.5 32 48.5C24.5 48.5 17.5 41.5 17.5 32C17.5 16.5 32 9.5 32 9.5Z"
    fill="#10B981"
    fill-opacity="0.22"
    stroke="url(#leafGrad)"
    stroke-width="2.8"
    stroke-linejoin="round"
  />

  <!-- 5. Neural Spine & Vein Circuits -->
  <path d="M32 14V44" stroke="#A7F3D0" stroke-width="2.6" stroke-linecap="round" />
  <path d="M32 22L40.5 18" stroke="#A7F3D0" stroke-width="2.2" stroke-linecap="round" />
  <path d="M32 29.5L23.5 25.5" stroke="#A7F3D0" stroke-width="2.2" stroke-linecap="round" />
  <path d="M32 37L39 33.5" stroke="#00D2FE" stroke-width="2.2" stroke-linecap="round" />

  <!-- 6. Central Sensor Pulse Core Node with Radiant Glow -->
  <circle cx="32" cy="32" r="5" fill="#10B981" filter="url(#nodeGlow)" />
  <circle cx="32" cy="32" r="4" fill="#34D399" />
  <circle cx="32" cy="32" r="2" fill="#FFFFFF" />
</svg>