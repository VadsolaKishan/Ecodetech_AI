version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: carboncopilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: carboncopilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carboncopilot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/carboncopilot
      - JWT_SECRET=carboncopilot_hackout26_secure_key_ai_copilot_998877
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost:80"]
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carboncopilot-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
